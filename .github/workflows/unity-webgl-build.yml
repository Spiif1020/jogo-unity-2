name: Build WebGL and Deploy

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build WebGL
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Baixa seu repositório
      - name: Checkout repository
        uses: actions/checkout@v4

      # Instala dependências da Unity Builder
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false

      # Faz build do WebGL ***sem precisar de licença***
      - name: Unity Builder
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: dummy@example.com
          UNITY_PASSWORD: dummy
        with:
          targetPlatform: WebGL
          unityVersion: auto
          allowDirtyBuild: true
          versioning: None
          buildName: WebGLBuild
          outputPath: build

      # Copia para /docs (onde o GitHub Pages lê)
      - name: Move build to docs
        run: |
          rm -rf docs
          mkdir docs
          cp -r build/WebGL/* docs/

      # Faz commit automático da pasta docs
      - name: Commit build
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add docs
          git commit -m "WebGL build" || echo "No changes to commit"

      # Faz push para o repositório
      - name: Push changes
        uses: ad-m/github-push-action@v0.8.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
